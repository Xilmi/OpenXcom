  # GeoScape
  STR_DISPLAY_HIDDEN_ALIEN_ACTIVITY: "Отображать скрытую активность"
  STR_DISPLAY_HIDDEN_ALIEN_ACTIVITY_DESC: "{ALT}0>{ALT} Отключено; {ALT}1>{ALT} Отображать сектора, где скрытая активность пришельцев продолжается 5+ часов; {NEWLINE}{ALT}2>{ALT} Отображать изменения активности максимально подробно."
  STR_DOGFIGHTAI: "Улучшенное поведение НЛО при перехвате"
  STR_DOGFIGHTAI_DESC: "Если по НЛО, способному догнать транспортное средство, открыт огонь, он пойдёт на сближение и откроет ответный огонь."

  # Brutal AI
  STR_AI: "ИИ"
  STR_BRUTALAI: "Тип ИИ"
  STR_BRUTALAI_DESC: "{ALT}0>{ALT} Обычный OpenXcom, {ALT}1>{ALT} Жестокий ИИ, {ALT}2>{ALT} Поиск и уничтожение."
  STR_BRUTALCIVILIANS: "Тип ИИ для гражданских"
  STR_BRUTALCIVILIANS_DESC: "{ALT}0>{ALT} Обычный OpenXcom, {ALT}1>{ALT} Жестокий ИИ, {ALT}2>{ALT} Поиск и уничтожение."
  STR_AICHEATMODE: "Степень жульничества Жестокого ИИ"
  STR_AICHEATMODE_DESC: "{ALT}-1>{ALT} Без Группового зрения; {ALT}0>{ALT} Жульничество отключено; {ALT}1>{ALT} ИИ знает о расположении ваших войск на миникарте; {ALT}2>{ALT} ИИ всегда видит ваши войска."
  STR_AI_PERFORMANCE: "Оптимизация производительности"
  STR_AI_PERFORMANCE_DESC: "ИИ просчитывает меньше вариантов, что позволяет сократить длительность его хода."
  STR_ALLOWPREPRIME: "Взведение гранат заранее Жестоким ИИ"
  STR_ALLOWPREPRIME_DESC: "Боевые единицы под управлением Жестокого ИИ могут взводить гранаты, если у них нет более приоритетных задач и ИИ считает, что это достаточно безопасно."
  STR_AVOIDMINES: "Обход сенсорных гранат Жестоким ИИ"
  STR_AVOIDMINES_DESC: "Боевые единицы, контролируемые ИИ, замечают сенсорные гранаты и обходят их. Не действует при включенной максимальной агрессивности ИИ."
  STR_IGNOREDELAY: "Дать ИИ пользоваться взрывчаткой на 1-ом ходу"
  STR_IGNOREDELAY_DESC: "По умолчанию враг не использует разрывное оружие до 3-го хода. Включение этой опции разрешит использовать взырчатку в любое время"

  # AutoCombat
  STR_AUTO: "Автоматический бой"
  STR_AUTOCOMBAT: "Режим автоматического боя"
  STR_AUTOCOMBAT_DESC: "ИИ управляет боевыми единицами игрока. Горячая клавиша для переключения режима настраивается в меню {ALT}Управление{ALT} {ALT}>{ALT} {ALT}BOXCE{ALT}. По умолчанию: {ALT}Ctrl + A{ALT}."
  STR_AUTOCOMBAT_DEFAULT_HWP: "Автобой по умолчанию @ ТБП"
  STR_AUTOCOMBAT_DEFAULT_HWP_DESC: "Вкл./выкл. автобой для всех ТБП по умолчанию."
  STR_AUTOCOMBAT_DEFAULT_MINDCONTROL: "Автобой по умолчанию @ Контроль разума"
  STR_AUTOCOMBAT_DEFAULT_MINDCONTROL_DESC: "Вкл./выкл. управление находящимися под пси-контролем в режиме автобоя по умолчанию."
  STR_AUTOCOMBAT_DEFAULT_REMAIN: "Автобой @ Включать по умолчанию"
  STR_AUTOCOMBAT_DEFAULT_REMAIN_DESC: "Вкл./выкл. сохранение режима автобоя включенным по умолчанию."
  STR_AUTOCOMBAT_DEFAULT_SOLDIER: "Автобой по умолчанию @ Каждый боец"
  STR_AUTOCOMBAT_DEFAULT_SOLDIER_DESC: "Вкл./выкл. автобой для всех бойцов по умолчанию."
  STR_AUTOCOMBAT_EACH_COMBAT: "Автобой @ Начало боя"
  STR_AUTOCOMBAT_EACH_COMBAT_DESC: "Включать автобой в начале боя."
  STR_AUTOCOMBAT_EACH_TURN: "Автобой @ Начало хода"
  STR_AUTOCOMBAT_EACH_TURN_DESC: "Оставлять автобой включенным в начале следующего хода."
  STR_AUTOCOMBAT_PER_UNIT: "Автобой @ Каждый боец"
  STR_AUTOCOMBAT_PER_UNIT_DESC: "Автобой включается/выключается для каждой боевой единицы независимо."
  
  # BaseScape
  STR_BATTLECHANCETOHIT: "Расчёт вероятности попадания"
  STR_BATTLECHANCETOHIT_DESC: "Отображать вероятность попадания вместо точности стрельбы{NEWLINE}и применять ее к порогу ответного огня."
  STR_DISPLAY_BASE_DEFENSE_PROBABILITY: "Отображать эффективность ПВО"
  STR_DISPLAY_BASE_DEFENSE_PROBABILITY_DESC: "Отображать вероятность уничтожения крупнейших НЛО вместо мощности ПВО на экране информации по базе."
  STR_DISPLAY_BASE_DETECTION_PROBABILITY: "Отобр. вероятность обнаружения НЛО"
  STR_DISPLAY_BASE_DETECTION_PROBABILITY_DESC: "Отображать вероятность обнаружения НЛО вместо количества радаров на экране информации по базе."
  STR_SHOW_CRAFT_HANGAR: "Отображать типы ангаров для ТС"
  STR_SHOW_CRAFT_HANGAR_DESC: "В статьях НЛОпедии, посвящённых транспортным средствам и перехватчикам, будет отображаться, способен ли ангар принимать ТС."

  # RA
  STR_BATTLERA: "Реалистичная меткость"
  STR_BATTLEREALISTICACCURACY: "Реалистичная меткость и укрытия (RA)"
  STR_BATTLEREALISTICACCURACY_DESC: "Полная переработка стрельбы: механика укрытий (CTRL для просмотра), уменьшенный разброс, защита от дружественного огня и случайных самоубийств, и ряд других улучшений"
  STR_BATTLEREALISTICCOVEREFFICIENCY: "Эффективность укрытий"
  STR_BATTLEREALISTICCOVEREFFICIENCY_DESC: "Процент точности стрельбы, на который влияет укрытие:{NEWLINE}{ALT}0>{ALT} 0 %;{ALT}1>{ALT} 30 %;{ALT}2>{ALT} 50 %;{ALT}3>{ALT} 70 %;{ALT}4>{ALT} 100 %."
  STR_BATTLEREALISTICDISPLAYROLLS: "Отображать разброс попадания"
  STR_BATTLEREALISTICDISPLAYROLLS_DESC: "Показывать разброс попадания для каждого выстрела в сравнении с меткостью в углу экрана."
  STR_BATTLEREALISTICDISPLAYOTHERSROLLS:  "Отображать разброс попадания для прочих"
  STR_BATTLEREALISTICDISPLAYOTHERSROLLS_DESC:  "Показывать разброс попадания врагов и нейтральных отрядов" 
  STR_BATTLEREALISTICIMPAIMED: "Снайперский бонус"
  STR_BATTLEREALISTICIMPAIMED_DESC: "Половина от доли точности, превышающей 100%, добавляется как бонус после применения штрафа от укрытия."
  STR_BATTLEREALISTICIMPLOF: "Улучшенная линия огня"
  STR_BATTLEREALISTICIMPLOF_DESC: "Огонь во всех режимах (не только прицельный или с колена) ведётся от уровня глаз. Линия огня соответствует линии видимости."
  STR_BATTLEREALISTICSHOTDISPERSION: "Разброс выстрелов"
  STR_BATTLEREALISTICSHOTDISPERSION_DESC: "{ALT}0>{ALT} Реалистичный - низкий разброс;{NEWLINE}{ALT}1>{ALT} Стандартный - выше реалистичного, но ниже оригинального."
  
  # BattleScape
  STR_BATTLEALTGRENADES: "Альтернативная меткость броска"
  STR_BATTLEALTGRENADES_DESC: "Снижает точность бросков. Дополнительный штраф за каждую клетку, начиная с расстояния, равное кв. корню из точности броска, умноженному на 3."
  STR_BATTLETERRAINSQUISHYNESS: "Разрушаемость окружения"
  STR_BATTLETERRAINSQUISHYNESS_DESC: "{ALT}0>{ALT} Неразрушаемо; {ALT}1>{ALT} Как в оригинальной игре; {NEWLINE}Прочность не превышает: {ALT}2>{ALT} Сплавы пришельцев; {ALT}3>{ALT} Кирпич; {NEWLINE}{ALT}4>{ALT} Дерево; {ALT}5>{ALT} Солома."
  STR_BATTLETHROWNSPEED: "Скорость броска"
  STR_BATTLETHROWNSPEED_DESC: "Меняет скорость бросаемых предметов: {NEWLINE}{ALT}0>{ALT} Совпадает со скоростью выстрелов;{NEWLINE}{ALT}1-20>{ALT} Значения соответствуют ползунку «Скорость выстрелов» в меню."
  STR_FOW: "Туман войны"
  STR_FOW_DESC: "Как и когда затемняются клетки вне зоны видимости боевой единицы: {NEWLINE}{ALT}0>{ALT} Отключён;{ALT}1>{ALT} Пошаговый режим;{ALT}2>{ALT} В реальном времени."
  STR_FOW_COLOR: "Цвет тумана войны"
  STR_FOW_COLOR_DESC: "Значения от 1 до 15 (16 для {ALT}TFTD{ALT}) обозначают различные цветовые оттенки. {NEWLINE}Подсказка: {ALT}1>{ALT} единый серебристо-серый цвет для {ALT}UFO{ALT} и {ALT}TFTD{ALT}."
  STR_INSTANTPRIME: "Взведение гранат одним щелчком"
  STR_INSTANTPRIME_DESC: "Отключает экран указания задержки перед взрывом гранаты. Задержка всегда будет равна 0 ходов."
  STR_PREPRIMEGRENADES: "Автовзведение гранат перед боем"
  STR_PREPRIMEGRENADES_DESC: "Какие типы гранат должны взводиться перед боем:{NEWLINE}{ALT}0>{ALT} Отключено;{ALT}1>{ALT} Только дымовые;{NEWLINE}{ALT}2>{ALT} Также обычные; {ALT}3>{ALT} Также сенсорные."
  STR_SHOOTING_SPREAD_MODE: "Режим разброса стрельбы"
  STR_SHOOTING_SPREAD_MODE_DESC: "{ALT}0>{ALT} Неравномерный (как в оригинальной игре); {NEWLINE}{ALT}1>{ALT} Равномерный во все стороны; {NEWLINE}{ALT}2>{ALT} Равномерно сниженный (шанс попадания выше)."
  STR_SMARTCONTROLEQUIP: "Умное самоснаряжение"
  STR_SMARTCONTROLEQUIP_DESC: "Щелчок мыши по предметам с нажатой Ctrl на экране экипировки положит их в ячейки, требующие меньше ОД. При использовании двуручного оружия вторая рука имеет наименьший приоритет."
  STR_STRICTBLOCKEDCHECKING: "Строгая проверка на доступность клеток"
  STR_STRICTBLOCKEDCHECKING_DESC: "Может предотвратить появление юнитов внутри стен и помочь ИИ находить лучшее укрытие, но может также блокировать сегменты карты, если она технически некорректна."
  STR_UPDATETURNSSINCESEENBYCLUE: "Точное отслеживание снарядов"
  STR_UPDATETURNSSINCESEENBYCLUE_DESC: "Позволяет игроку (нажав кпопку {ALT}Alt{Alt}) и Жестокому ИИ точно определить клетку, откуда был выпущен вражеский снаряд, даже не видя самого стрелка."
  STR_FORCED_ABSOLUTE_COSTS: "Только фиксированный расход"
  STR_FORCED_ABSOLUTE_COSTS_DESC: "При включении все процентные значения потребления ОД и других показателей будут преобразованы в фиксированные."
  # Diagonal Terrain melee
  STR_DIAG_TERRAIN_MELEE: "Рукопашно местность по диагонали"
  STR_DIAG_TERRAIN_MELEE_DESC: "Атака объектов ландшафта по диагонали в ближнем бою.{NEWLINE}Требует включения опции {ALT}terrainMeleeExtended{ALT}.{NEWLINE}{ALT}Alt+клик{ALT} - принудительно бить текущую и соседние клетки."
  # Floating unit Bobbing
  STR_FLOAT_UNIT_BOBBING: "Покачивание парящих отрядов"  
  STR_FLOAT_UNIT_BOBBING_DESC: "Каждый отряд будет cлегка покачиваться в летающем/парящем состоянии."